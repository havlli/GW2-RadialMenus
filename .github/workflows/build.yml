name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        run: msbuild GW2-RadialMenus.sln -p:Configuration=Release -p:Platform=x64 -m -v:minimal

      - name: Resolve artifact name
        id: meta
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $branch = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          "name=radials-$branch-$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload radials.dll
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: x64/radials.dll
          if-no-files-found: error
          retention-days: 30
